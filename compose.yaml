x-database-env: &database-env
  PGHOST: schvopsel-postgres
  PGDATABASE: ${POSTGRES_DB:-schvopsel}
  PGUSER: ${POSTGRES_USER:-schvopsel}
  PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo}

services:
  app:
    build: .
    image: schvopsel:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    environment:
      <<: *database-env
      SCHEDULE_SOURCE: ${SCHEDULE_SOURCE:-}
      MODE: ${mode:?Set mode=demo or mode=prod in .env}
      MAIN_ADMIN_TELEGRAM_ID: ${MAIN_ADMIN_TELEGRAM_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    depends_on:
      db-ready:
        condition: service_completed_successfully
    restart: unless-stopped
  schedule-worker:
    profiles: ["schedule"]
    build:
      context: .
      target: schedule-worker
    image: schvopsel-ocr:local
    cpus: 0.4
    environment:
      <<: *database-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: /run/telegram/channel_listener.session
      CHANNEL_USERNAME: ${CHANNEL_USERNAME:-}
      CHANNEL_TARGET: ${CHANNEL_TARGET:-}
      TARGET_GROUP: ${TARGET_GROUP:-11П}
    volumes:
      - type: bind
        source: ${TELEGRAM_SESSION_PATH:-./channel_listener.session}
        target: /run/telegram/channel_listener.session
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-ready:
        condition: service_completed_successfully
    restart: unless-stopped
  telegram-bot:
    profiles: ["bot"]
    build:
      context: .
      target: telegram-bot
    image: schvopsel-bot:local
    environment:
      <<: *database-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAIN_ADMIN_TELEGRAM_ID: ${MAIN_ADMIN_TELEGRAM_ID:-}
    depends_on:
      db-ready:
        condition: service_completed_successfully
    restart: unless-stopped
  db:
    build:
      context: .
      target: database
    image: schvopsel-db:local
    networks:
      default:
        aliases: [schvopsel-postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schvopsel}
      POSTGRES_USER: ${POSTGRES_USER:-schvopsel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    volumes:
      - data:/var/lib/postgresql
    restart: unless-stopped
  db-ready:
    image: schvopsel-db:local
    environment:
      <<: *database-env
      PGCONNECT_TIMEOUT: 2
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 45); do
          if psql -w -tAc 'SELECT 1' >/dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        psql -w -tAc 'SELECT 1'
    depends_on:
      - db
volumes:
  data:
